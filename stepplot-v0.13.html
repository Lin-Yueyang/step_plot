  const editor = event.target.closest('input[type="text"],textarea');
  if ((event.ctrlKey || event.metaKey) && (event.code === 'Equal' || event.key === '=' || event.key === '+') && editor?.closest('.field')?.querySelector('[data-format]')) { event.preventDefault(); applyScript(editor, event.shiftKey ? 'super' : 'sub'); return; }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') { event.preventDefault(); saveProject(); }
  const textEditor = !event.target.closest('#text-toolbar') && event.target.closest('textarea,input:not([type="color"]):not([type="checkbox"]):not([type="range"]):not([type="button"]),[contenteditable="true"]');
  if ((event.ctrlKey || event.metaKey) && ['z','y'].includes(event.key.toLowerCase()) && !textEditor) { event.preventDefault(); historyStep(event.key.toLowerCase() === 'y' || event.shiftKey ? 1 : -1); }
  if (event.key === 'Delete' && !event.defaultPrevented && selection?.kind === 'annotation' && !event.target.closest('input,textarea,select,[contenteditable="true"]') && !document.querySelector('dialog[open]')) {
    event.preventDefault(); setTextHidden(selectedKeys(), true); openInspector(); inspectTab = 'object'; changed(); return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'a' && !event.target.closest('input,textarea,select')) { event.preventDefault(); selectAnnotations([...annotationMeta.values()].filter(m => !m.hidden && String(m.shown).trim()).map(m => m.key)); }
  if (event.key === 'Escape') { finishCanvasText(false); selection = null; renderSelection(); closeInspector(); }
  if (selection?.kind === 'legend' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key) && !event.target.closest('input,textarea,select')) {
    event.preventDefault(); const amount = event.shiftKey ? 10 : 1;
    project.style.legendDx = Math.max(-2400, Math.min(2400, (project.style.legendDx ?? 0) + (event.key === 'ArrowLeft' ? -amount : event.key === 'ArrowRight' ? amount : 0)));
    project.style.legendDy = Math.max(-2400, Math.min(2400, (project.style.legendDy ?? 0) + (event.key === 'ArrowUp' ? -amount : event.key === 'ArrowDown' ? amount : 0)));
    changed();
  }
  if (selection?.kind === 'annotation' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key) && !event.target.closest('input,textarea,select')) {
    event.preventDefault(); const amount = event.shiftKey ? 10 : 1;
    for (const key of selectedKeys()) { const a = project.annotations[key] ||= {}, meta = annotationMeta.get(key); a.dx = (a.dx || 0) + meta.baseX - meta.x + (event.key === 'ArrowLeft' ? -amount : event.key === 'ArrowRight' ? amount : 0); a.dy = (a.dy || 0) + meta.baseY - meta.y + (event.key === 'ArrowUp' ? -amount : event.key === 'ArrowDown' ? amount : 0); }
    changed();
  }
});
function resizePane(side,value) {
  const workspace=document.querySelector('.workspace'), other=side==='left' ? $('inspector') : document.querySelector('.data-panel');
  const max=Math.max(240,window.innerWidth-other.getBoundingClientRect().width-330);
  const width=Math.round(Math.max(240,Math.min(Math.min(560,max),value)));
  workspace.style.setProperty('--'+side+'-width',width+'px');
  $(side+'-resize').setAttribute('aria-valuenow',width);
}
document.querySelectorAll('.resize-handle').forEach(handle=>{
  handle.addEventListener('pointerdown',event=>{
    if (event.button!==0) return;
    const side=handle.dataset.side, pane=side==='left' ? document.querySelector('.data-panel') : $('inspector');
    paneDrag={side,start:event.clientX,width:pane.getBoundingClientRect().width,id:event.pointerId};
    handle.setPointerCapture(event.pointerId); document.body.classList.add('resizing'); event.preventDefault();
  });
  handle.addEventListener('pointermove',event=>{ if (paneDrag?.id===event.pointerId) resizePane(paneDrag.side,paneDrag.width+(event.clientX-paneDrag.start)*(paneDrag.side==='left'?1:-1)); });
  const end=()=>{ paneDrag=null; document.body.classList.remove('resizing'); };
  handle.addEventListener('pointerup',end); handle.addEventListener('pointercancel',end);
  handle.addEventListener('keydown',event=>{
    if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
    event.preventDefault(); const side=handle.dataset.side, pane=side==='left' ? document.querySelector('.data-panel') : $('inspector');
    resizePane(side,pane.getBoundingClientRect().width+(event.key==='ArrowRight'?12:-12)*(side==='left'?1:-1));
  });
});
cards = StepCards({ project:()=>project, esc, rich, changed, toast, context:openStateMenu,
  edit:(sid,id)=>selectObject('node',id,sid),
  remove:item=>item.kind==='node' ? removeState(item.sid,item.id) : removeConnection(item.sid,item.id),
  undo:()=>historyStep(-1), redo:()=>historyStep(1) });
$('recovery-bar').hidden=!recovery;
record(); renderAll();

</script>
